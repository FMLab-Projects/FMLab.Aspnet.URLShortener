# Deploy target: homelab (self-hosted runner, see .github/workflows/deploy-homelab.yml).
# Postgres, Redis and the reverse proxy (Traefik) are already running in the
# homelab and shared across apps — this stack only runs the API container.

name: fmlab-url-shortener

services:

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER}/fmlab-url-shortener:${IMAGE_TAG:-latest}
    container_name: fmlab-url-shortener-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      # appsettings.json pins AllowedHosts to the old EC2 domain (*.fagnermarinho.dev).
      # Traefik already only forwards requests matching APP_HOSTNAME, and the
      # container's own HEALTHCHECK hits 127.0.0.1 — neither matches that pattern,
      # so host filtering is redundant here and gets disabled.
      AllowedHosts: "*"
      ApiKey: ${API_KEY}
      Database:Server: ${DB_SERVER}
      Database:Port: ${DB_PORT}
      Database:Name: ${DB_NAME}
      Database:User: ${DB_USER}
      Database:Password: ${DB_PASSWORD}
      Redis:Host: ${REDIS_HOST}
      Redis:Port: ${REDIS_PORT}
      Redis:Password: ${REDIS_PASSWORD}
    networks:
      homelab-network:
        aliases:
          - fmlab-url-shortener
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.urlshortener.rule=Host(`${APP_HOSTNAME}`)"
      - "traefik.http.routers.urlshortener.entrypoints=web"
      - "traefik.http.services.urlshortener.loadbalancer.server.port=8080"
      - "traefik.docker.network=homelab-network"

networks:
  homelab-network:
    external: true
    name: ${HOMELAB_NETWORK:-homelab-network}
